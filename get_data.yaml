name: CDN URLs Extractor
inputs:
  - {name: bearer_token, type: string, description: "Path to file containing bearer token"}
  - {name: domain, type: String, description: "Base domain, e.g. https://igs.gov-cloud.ai"}
  - {name: schema_id, type: String, description: "Schema ID for the entity instances"}
  - {name: project_id, type: String, optional: true, default: "-1", description: "Project ID (use '-1' to skip)"}
  - {name: model_id, type: String, optional: true, default: "-1", description: "Model ID (use '-1' to skip)"}

outputs:
  - {name: config_cdn, type: String, description: "Config CDN URL"}
  - {name: pt_cdn, type: String, description: "PyTorch model CDN URL"}
  - {name: vocabulary_cdn, type: String, description: "Vocabulary/Tokenizer CDN URL"}

implementation:
  container:
    image: name: CDN URLs Extractor
inputs:
  - {name: bearer_token, type: string, description: "Path to file containing bearer token"}
  - {name: domain, type: String, description: "Base domain, e.g. https://igs.gov-cloud.ai"}
  - {name: schema_id, type: String, description: "Schema ID for the entity instances"}
  - {name: project_id, type: String, optional: true, default: "-1", description: "Project ID (use '-1' to skip)"}
  - {name: model_id, type: String, optional: true, default: "-1", description: "Model ID (use '-1' to skip)"}

outputs:
  - {name: config_cdn, type: String, description: "Config CDN URL"}
  - {name: pt_cdn, type: String, description: "PyTorch model CDN URL"}
  - {name: vocabulary_cdn, type: String, description: "Vocabulary/Tokenizer CDN URL"}

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:vtest4
    command:
      - python3
      - -u
      - -c
      - |
        import argparse
        import json
        import os
        import sys
        import requests

        parser = argparse.ArgumentParser(description="Extract CDN URLs from schema instances")
        parser.add_argument('--bearer_token', required=True)
        parser.add_argument('--domain', required=True)
        parser.add_argument('--schema_id', required=True)
        parser.add_argument('--project_id', default="-1")
        parser.add_argument('--model_id', default="-1")
        parser.add_argument('--config_cdn', required=True)
        parser.add_argument('--pt_cdn', required=True)
        parser.add_argument('--vocabulary_cdn', required=True)
        args = parser.parse_args()

        # Read bearer token
        try:
            with open(args.bearer_token, "r", encoding="utf-8") as f:
                token = f.read().strip()
        except Exception as e:
            print(f"[ERROR] Failed to read bearer token: {e}", file=sys.stderr)
            sys.exit(1)

        # Build filter dynamically - skip fields with -1 value
        filter_obj = {}
        
        if args.project_id != "-1":
            filter_obj["projectId"] = args.project_id
            print(f"[INFO] Including projectId in filter: {args.project_id}")
        else:
            print("[INFO] Skipping projectId (value is -1)")
        
        if args.model_id != "-1":
            filter_obj["model_id"] = args.model_id
            print(f"[INFO] Including model_id in filter: {args.model_id}")
        else:
            print("[INFO] Skipping model_id (value is -1)")

        # Construct URL
        url = (
            f"{args.domain.rstrip('/')}"
            f"/pi-entity-instances-service/v3.0/schemas/{args.schema_id}/instances/list"
        )

        # Build request payload
        payload = {
            "dbType": "TIDB",
            "ownedOnly": True,
            "filter": filter_obj
        }

        # Headers
        headers = {
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json"
        }

        # Print debug information
        print(f"[DEBUG] API URL: {url}")
        print(f"[DEBUG] Filter: {json.dumps(filter_obj, indent=2)}")
        print(f"[DEBUG] Full Payload: {json.dumps(payload, indent=2)}")

        # Make the request
        try:
            print("[INFO] Making API request...")
            response = requests.post(url, headers=headers, json=payload, timeout=60)
            
            if not response.ok:
                error_detail = ""
                try:
                    error_json = response.json()
                    error_detail = json.dumps(error_json, indent=2)
                except:
                    error_detail = response.text
                
                print(f"[ERROR] API request failed with status {response.status_code}", file=sys.stderr)
                print(f"[ERROR] Response: {error_detail}", file=sys.stderr)
                response.raise_for_status()

            # Parse response
            data = response.json()
            print(f"[DEBUG] API Response: {json.dumps(data, indent=2)}")

            # Extract instances list from 'content' key
            instances = data.get("content", [])
            if not instances:
                print("[ERROR] No instances found in response content", file=sys.stderr)
                sys.exit(1)

            # Get first instance
            first_instance = instances[0]
            print(f"[INFO] Found {len(instances)} instance(s), using first one")

            # Extract CDN URLs
            config_cdn_url = first_instance.get("config_cdn", "")
            pt_cdn_url = first_instance.get("pt_cdn", "")
            vocabulary_cdn_url = first_instance.get("vocabulary_cdn", "")

            # Validate URLs exist
            if not config_cdn_url:
                print("[ERROR] config_cdn not found in instance", file=sys.stderr)
                sys.exit(1)
            if not pt_cdn_url:
                print("[ERROR] pt_cdn not found in instance", file=sys.stderr)
                sys.exit(1)
            if not vocabulary_cdn_url:
                print("[ERROR] vocabulary_cdn not found in instance", file=sys.stderr)
                sys.exit(1)

            # Write outputs
            os.makedirs(os.path.dirname(args.config_cdn), exist_ok=True)
            os.makedirs(os.path.dirname(args.pt_cdn), exist_ok=True)
            os.makedirs(os.path.dirname(args.vocabulary_cdn), exist_ok=True)

            with open(args.config_cdn, "w", encoding="utf-8") as f:
                f.write(config_cdn_url)
            
            with open(args.pt_cdn, "w", encoding="utf-8") as f:
                f.write(pt_cdn_url)
            
            with open(args.vocabulary_cdn, "w", encoding="utf-8") as f:
                f.write(vocabulary_cdn_url)

            # Print success
            print("[SUCCESS] CDN URLs extracted successfully:")
            print(f"  - config_cdn: {config_cdn_url}")
            print(f"  - pt_cdn: {pt_cdn_url}")
            print(f"  - vocabulary_cdn: {vocabulary_cdn_url}")

        except requests.exceptions.RequestException as e:
            print(f"[ERROR] Request failed: {str(e)}", file=sys.stderr)
            sys.exit(1)
        except Exception as e:
            print(f"[ERROR] Unexpected error: {str(e)}", file=sys.stderr)
            import traceback
            traceback.print_exc()
            sys.exit(1)

    args:
      - --bearer_token
      - {inputPath: bearer_token}
      - --domain
      - {inputValue: domain}
      - --schema_id
      - {inputValue: schema_id}
      - --project_id
      - {inputValue: project_id}
      - --model_id
      - {inputValue: model_id}
      - --config_cdn
      - {outputPath: config_cdn}
      - --pt_cdn
      - {outputPath: pt_cdn}
      - --vocabulary_cdn
      - {outputPath: vocabulary_cdn}
