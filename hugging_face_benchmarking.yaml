name: BenchmarksEvals V5 - HuggingFace
inputs:
  - name: model_name
    type: String
    description: "HuggingFace model name (e.g., 'distilgpt2', 'meta-llama/Llama-2-7b-hf')"
  - name: hf_token
    type: String
    default: ""
    description: "Optional: HuggingFace token for gated models (leave empty for public models)"
  - name: tasks
    type: String
    default: "gpqa,mmlu_pro,bbh,math,ifeval"
    description: "Comma-separated list of tasks. Use 'math' for hendrycks_math"
  - name: limit
    type: Integer
    default: "100"
    description: "Examples per task. Use -1 for all examples"
  - name: batch_size
    type: Integer
    default: "6"
    description: "Batch size. Use -1 for auto"
  - name: num_fewshot
    type: Integer
    default: "0"
    description: "Number of few-shot examples"

outputs:
  - name: compact_metrics
    type: Data
    description: "Compact JSON with key metrics per task"
  - name: full_results
    type: Data
    description: "Full evaluation results with all details"
  - name: emissions_csv
    type: Data
    description: "CO2 emissions tracking CSV"
  - name: schema_json
    type: String
    description: "Schema-formatted JSON with percentage scores"

implementation:
  container:
    image: gurpreetgandhi/nesy-factory:v38-gpu
    command:
      - sh
      - -c
      - |
        # Step 1: Remove ALL conflicting packages
        pip uninstall -y torch torchvision torchaudio xformers torchao unsloth-zoo triton nesy-factory 2>/dev/null || true
        
        # Step 2: Install PyTorch
        pip install --no-cache-dir \
          torch==2.5.1 \
          torchvision==0.20.1 \
          torchaudio==2.5.1
        
        # Step 3: Install lm-evaluation-harness from source to avoid circular import
        pip uninstall -y lm-eval 2>/dev/null || true
        git clone --depth 1 --branch v0.4.4 https://github.com/EleutherAI/lm-evaluation-harness /tmp/lm-eval
        cd /tmp/lm-eval
        # Install without evaluate dependency first
        pip install --no-cache-dir -e .
        cd /
        
        # Step 4: Install other required packages
        pip install --no-cache-dir \
          transformers>=4.35.0 \
          accelerate>=0.25.0 \
          datasets>=2.14.0 \
          evaluate>=0.4.0 \
          scikit-learn>=1.3.0 \
          pandas>=2.0.0 \
          numpy<2.0.0 \
          tqdm>=4.65.0 \
          sentencepiece>=0.1.99 \
          protobuf>=3.20.0 \
          tokenizers>=0.13.0 \
          codecarbon>=2.3.0 \
          peft>=0.7.0 \
          bitsandbytes>=0.41.0 \
          einops>=0.7.0 \
          scipy>=1.11.0
        
        # Create Python script with fix for circular imports
        cat > /tmp/evaluate.py << 'EOF'
        import sys
        import os
        
        # Fix: Rename evaluate module to avoid conflict
        if 'evaluate' in sys.modules:
            del sys.modules['evaluate']
        
        # Now import argparse first
        import argparse
        import json
        import time
        import traceback
        import numpy as np
        import torch
        import psutil
        import shutil
        from huggingface_hub import HfFolder
        from datasets import load_dataset
        from codecarbon import EmissionsTracker
        
        # Import lm_eval carefully to avoid circular imports
        try:
            # Clear any existing imports
            for mod in list(sys.modules.keys()):
                if mod.startswith('lm_eval'):
                    del sys.modules[mod]
            
            # Now import lm_eval
            import lm_eval
            from lm_eval import evaluator
            from lm_eval.models.huggingface import HFLM
            from lm_eval.tasks import TaskManager
        except ImportError as e:
            print(f"Import error: {e}", flush=True)
            sys.exit(1)

        def log(msg):
            ts = time.strftime("%Y-%m-%d %H:%M:%S")
            print(f"[EVAL {ts}] {msg}", flush=True)

        log("Starting BenchmarksEvals v1 - HuggingFace Direct Mode")

        # Parse arguments - read from environment variables to avoid shell issues
        import sys
        
        # Parse command line arguments manually
        args_dict = {}
        i = 1
        while i < len(sys.argv):
            arg = sys.argv[i]
            if arg.startswith('--'):
                key = arg[2:]
                if i + 1 < len(sys.argv) and not sys.argv[i + 1].startswith('--'):
                    args_dict[key] = sys.argv[i + 1]
                    i += 2
                else:
                    args_dict[key] = True
                    i += 1
            else:
                i += 1
        
        # Set default values
        MODEL_NAME = args_dict.get('model_name', '')
        HF_TOKEN = args_dict.get('hf_token', '')
        TASKS_STR = args_dict.get('tasks', 'gpqa,mmlu_pro,bbh,math,ifeval')
        LIMIT = int(args_dict.get('limit', '100'))
        BATCH_SIZE = int(args_dict.get('batch_size', '6'))
        NUM_FEWSHOT = int(args_dict.get('num_fewshot', '0'))
        OUT_COMPACT = args_dict.get('out_compact', '')
        OUT_FULL = args_dict.get('out_full', '')
        OUT_EMISSIONS = args_dict.get('out_emissions', '')
        OUT_SCHEMA = args_dict.get('out_schema', '')
        
        if not MODEL_NAME:
            log("ERROR: Model name is required")
            sys.exit(1)
        
        if not all([OUT_COMPACT, OUT_FULL, OUT_EMISSIONS, OUT_SCHEMA]):
            log("ERROR: All output paths are required")
            sys.exit(1)

        # Handle limit: -1 means all examples
        eval_limit = None if LIMIT == -1 else LIMIT
        log(f"Limit: {'ALL examples' if eval_limit is None else f'{eval_limit} per task'}")

        # Handle batch_size: -1 means auto
        eval_batch_size = "auto" if BATCH_SIZE == -1 else BATCH_SIZE
        log(f"Batch size: {eval_batch_size}")

        log(f"Configuration:")
        log(f"  Model: {MODEL_NAME}")
        log(f"  Tasks: {TASKS_STR}")
        log(f"  Limit: {eval_limit if eval_limit is not None else 'ALL'}")
        log(f"  Batch size: {eval_batch_size}")
        log(f"  Few-shot: {NUM_FEWSHOT}")

        # Setup paths
        OUT_COMPACT = os.path.abspath(OUT_COMPACT)
        OUT_FULL = os.path.abspath(OUT_FULL)
        OUT_EMISSIONS = os.path.abspath(OUT_EMISSIONS)
        OUT_SCHEMA = os.path.abspath(OUT_SCHEMA)

        # Ensure output directories exist
        for path in [OUT_COMPACT, OUT_FULL, OUT_EMISSIONS, OUT_SCHEMA]:
            parent_dir = os.path.dirname(path)
            if parent_dir:
                os.makedirs(parent_dir, exist_ok=True)

        # Setup HuggingFace authentication (optional)
        TOKEN = HF_TOKEN.strip()
        if TOKEN:
            os.environ["HUGGINGFACE_HUB_TOKEN"] = TOKEN
            os.environ["HF_TOKEN"] = TOKEN
            HfFolder.save_token(TOKEN)
            log("✓ HuggingFace token configured for gated models")
        else:
            log("ℹ No HF token - only public models accessible")

        # Setup cache directories
        os.environ.update({
            "HF_HUB_DISABLE_TELEMETRY": "1",
            "HF_HOME": "/tmp/hf_cache",
            "HF_DATASETS_CACHE": "/tmp/hf_cache",
            "HUGGINGFACE_HUB_CACHE": "/tmp/hf_cache"
        })

        # Parse and validate tasks
        tm = None
        task_name_map = {}
        
        try:
            tm = TaskManager()
            avail = set(tm.task_index)
            math_tasks = sorted([t for t in avail if "hendrycks_math" in t.lower()])
            if math_tasks:
                log(f"Available math tasks: {math_tasks[:3]}...")
        except Exception as e:
            log(f"⚠ Failed to build TaskManager: {e}")
            math_tasks = []
            avail = set()

        req_tasks = TASKS_STR.strip()
        
        # Handle "math" task expansion
        if req_tasks.lower() in ("math", "math_auto"):
            selected_math = math_tasks[0] if math_tasks else "hendrycks_math"
            TASKS = [selected_math]
            task_name_map[selected_math] = "math"
            log(f"Expanded 'math' → '{selected_math}'")
        else:
            parsed_tasks = [t.strip() for t in req_tasks.split(",") if t.strip()]
            TASKS = []
            
            for original_task in parsed_tasks:
                task_lower = original_task.lower()
                
                if task_lower in ("math", "math_auto"):
                    actual_task = math_tasks[0] if math_tasks else "hendrycks_math"
                    TASKS.append(actual_task)
                    task_name_map[actual_task] = "math"
                    log(f"Mapped '{original_task}' → '{actual_task}'")
                else:
                    TASKS.append(original_task)
                    task_name_map[original_task] = original_task
                    
                    if tm and original_task not in avail:
                        log(f"⚠ WARNING: '{original_task}' not in task registry")

        log(f"Will evaluate {len(TASKS)} task(s): {TASKS}")

        # Composite group for averaging
        COMPOSITE_GROUP = ["mmlu_pro", "bbh", "math", "ifeval"]

        # Preload datasets
        PRELOAD_MAP = {
            "gpqa": [("Idavidrein/gpqa", "gpqa_main")],
        }

        def preload_for_task(task):
            task_key = task.lower()
            for keyword, entries in PRELOAD_MAP.items():
                if keyword in task_key:
                    for repo, split in entries:
                        try:
                            log(f"Preloading {repo}::{split}")
                            load_dataset(repo, split, cache_dir="/tmp/hf_cache", token=TOKEN)
                            log(f"✓ Preloaded {repo}")
                            return True
                        except Exception as e:
                            log(f"⚠ Preload failed: {e}")
            return False

        # Log system resources
        try:
            mem = psutil.virtual_memory()
            log(f"RAM: {mem.total/1e9:.1f} GB total, {mem.available/1e9:.1f} GB available")
        except:
            pass

        try:
            total, used, free = shutil.disk_usage("/")
            log(f"Disk: {total/1e9:.1f} GB total, {free/1e9:.1f} GB free")
        except:
            pass

        # Start emissions tracking
        log(f"Starting CO2 tracker → {OUT_EMISSIONS}")
        tracker = EmissionsTracker(
            output_dir=os.path.dirname(OUT_EMISSIONS) or ".",
            output_file=os.path.basename(OUT_EMISSIONS)
        )
        tracker.start()

        # Detect device
        if torch.cuda.is_available():
            gpu_count = torch.cuda.device_count()
            log(f"Detected {gpu_count} CUDA device(s)")
            for i in range(gpu_count):
                try:
                    name = torch.cuda.get_device_name(i)
                    mem = torch.cuda.get_device_properties(i).total_memory / 1e9
                    log(f"  GPU {i}: {name} | {mem:.1f} GB")
                except:
                    pass
            eval_device = "cuda"
        else:
            log("⚠ CUDA not available - using CPU")
            eval_device = "cpu"

        # Load model from HuggingFace using HFLM
        log(f"Loading model from HuggingFace: {MODEL_NAME}")
        try:
            model = HFLM(
                pretrained=MODEL_NAME,
                tokenizer=MODEL_NAME,
                device=eval_device,
                batch_size=eval_batch_size,
                trust_remote_code=False
            )
            log("✓ Model loaded successfully")
        except Exception as e:
            log(f"✗ FATAL: Failed to load model: {e}")
            traceback.print_exc()
            raise

        # Detect model context length
        from transformers import AutoTokenizer
        
        try:
            log("Detecting model maximum sequence length...")
            tok = AutoTokenizer.from_pretrained(
                MODEL_NAME,
                cache_dir="/tmp/hf_cache",
                use_fast=True
            )
        
            model_max_len = getattr(tok, "model_max_length", None)
        
            if not model_max_len or model_max_len > 100_000:
                model_max_len = 1024
        
            log(f"Model max sequence length = {model_max_len}")
        
        except Exception as e:
            log(f"⚠ Could not detect tokenizer max length: {e}")
            model_max_len = 1024
        
        # Set safe max generation tokens
        DEFAULT_GEN_TOKS = 256
        safe_max_gen_toks = min(DEFAULT_GEN_TOKS, model_max_len - 1)
        safe_max_gen_toks = max(safe_max_gen_toks, 1)
        
        log(f"Using max_gen_toks = {safe_max_gen_toks}")

        def safe_json(obj):
            if isinstance(obj, dict):
                return {k: safe_json(v) for k, v in obj.items()}
            if isinstance(obj, (list, tuple)):
                return [safe_json(v) for v in obj]
            try:
                if hasattr(obj, "item"):
                    return obj.item()
            except:
                pass
            if isinstance(obj, np.ndarray):
                return obj.tolist()
            if isinstance(obj, (np.dtype, torch.dtype, torch.device, type)):
                return str(obj)
            try:
                json.dumps(obj)
                return obj
            except:
                return str(obj)

        def pick_metric(result_dict):
            for key in ("acc_norm", "exact_match", "acc", "accuracy"):
                if key in result_dict and isinstance(result_dict[key], (int, float)):
                    return key, float(result_dict[key])
            for key, value in result_dict.items():
                if isinstance(value, (int, float)) and key not in ("alias", "samples"):
                    return key, float(value)
            return None, None

        # Run evaluations
        compact_results = {}
        full_results = {}
        schema_results = {}
        total_tasks = len(TASKS)

        log("=" * 70)
        log(f"Starting evaluation of {total_tasks} task(s)")
        log("=" * 70)

        for idx, actual_task in enumerate(TASKS, start=1):
            original_task = task_name_map.get(actual_task, actual_task)
            
            log(f"{'=' * 70}")
            log(f"Task {idx}/{total_tasks}: {original_task}")
            if actual_task != original_task:
                log(f"  (evaluating as: {actual_task})")
            log(f"{'=' * 70}")
            
            preload_for_task(actual_task)
            
            start_time = time.time()
            try:
                log(f"Running with limit={eval_limit}, fewshot={NUM_FEWSHOT}")
                
                result = evaluator.simple_evaluate(
                    model=model,
                    tasks=[actual_task],
                    num_fewshot=NUM_FEWSHOT,
                    limit=eval_limit,
                    gen_kwargs={"max_gen_toks": safe_max_gen_toks}  
                )
                
                duration = time.time() - start_time
                full_results[original_task] = safe_json(result)
                
                # Extract metrics
                results_dict = result.get("results", {})
                task_result = results_dict.get(actual_task) or (
                    next(iter(results_dict.values())) if results_dict else None
                )

                if isinstance(task_result, dict):
                    metric_name, metric_value = pick_metric(task_result)
                    if metric_name is not None:
                        compact_results[original_task] = {
                            metric_name: metric_value,
                            "time_s": round(duration, 3)
                        }
                        schema_results[original_task] = round(metric_value * 100.0, 2)
                        log(f"✓ {metric_name} = {metric_value:.4f} ({duration:.1f}s)")
                    else:
                        compact_results[original_task] = {
                            "note": "no numeric metric found",
                            "time_s": round(duration, 3)
                        }
                        log(f"⚠ No numeric metric found ({duration:.1f}s)")
                else:
                    compact_results[original_task] = {
                        "note": "unexpected result structure",
                        "raw": safe_json(task_result),
                        "time_s": round(duration, 3)
                    }
                    log(f"⚠ Unexpected result structure ({duration:.1f}s)")

            except Exception as e:
                duration = time.time() - start_time
                tb = traceback.format_exc()
                log(f"✗ Task failed: {e}")
                print(tb, flush=True)
                compact_results[original_task] = {
                    "error": str(e),
                    "time_s": round(duration, 3)
                }
                full_results[original_task] = {
                    "error": str(e),
                    "traceback": tb,
                    "time_s": round(duration, 3)
                }

        # Stop emissions tracking
        log("Stopping emissions tracker...")
        try:
            emissions = tracker.stop()
            co2_val = float(emissions)
        except Exception as e:
            log(f"⚠ Failed to stop tracker: {e}")
            co2_val = 0.0
        
        compact_results["co2_emissions_kg"] = round(co2_val, 6)
        full_results["co2_emissions_kg"] = round(co2_val, 6)
        schema_results["co2_emissions_kg"] = round(co2_val, 6)
        schema_results["ModelName"] = MODEL_NAME
        log(f"✓ CO2 emissions: {co2_val:.6f} kg")

        # Compute composite mean
        found_vals = []
        for original_task in COMPOSITE_GROUP:
            entry = compact_results.get(original_task)
            if isinstance(entry, dict):
                for key, value in entry.items():
                    if key in ("time_s", "error") or key.startswith("note"):
                        continue
                    if isinstance(value, (int, float)):
                        found_vals.append(float(value))
                        break

        if found_vals:
            composite_score = float(np.mean(found_vals))
            compact_results["composite_mean"] = round(composite_score, 6)
            schema_results["composite_mean"] = round(composite_score * 100.0, 2)
            log(f"✓ Composite mean: {composite_score:.4f}")
        else:
            log(f"⚠ No valid scores for composite mean")

        # Compute math tasks mean (compact only)
        math_scores = []
        for original_task, entry in compact_results.items():
            if "math" in original_task.lower():
                if isinstance(entry, dict):
                    for key, value in entry.items():
                        if key in ("time_s", "error") or key.startswith("note"):
                            continue
                        if isinstance(value, (int, float)):
                            math_scores.append(float(value))
                            break
        
        if math_scores:
            math_mean = float(np.mean(math_scores))
            compact_results["math_mean"] = round(math_mean, 6)
            log(f"✓ Math mean: {math_mean:.4f}")

        # Save outputs
        log("Saving results...")
        save_errors = []
        
        try:
            with open(OUT_COMPACT, "w") as f:
                json.dump(safe_json(compact_results), f, indent=2)
            log(f"✓ Compact: {OUT_COMPACT}")
        except Exception as e:
            err = f"Failed to save compact: {e}"
            log(f"✗ {err}")
            save_errors.append(err)

        try:
            with open(OUT_FULL, "w") as f:
                json.dump(safe_json(full_results), f, indent=2)
            log(f"✓ Full: {OUT_FULL}")
        except Exception as e:
            err = f"Failed to save full: {e}"
            log(f"✗ {err}")
            save_errors.append(err)

        try:
            with open(OUT_SCHEMA, "w") as f:
                json.dump(schema_results, f, indent=2)
            log(f"✓ Schema: {OUT_SCHEMA}")
        except Exception as e:
            err = f"Failed to save schema: {e}"
            log(f"✗ {err}")
            save_errors.append(err)

        if os.path.exists(OUT_EMISSIONS):
            log(f"✓ Emissions: {OUT_EMISSIONS}")
        else:
            log(f"⚠ Emissions CSV not found")

        # Print summary
        log("=" * 70)
        log("EVALUATION SUMMARY")
        log("=" * 70)
        log(f"Model: {MODEL_NAME}")
        
        for task, data in compact_results.items():
            if task in ("co2_emissions_kg", "composite_mean", "math_mean"):
                continue
            if isinstance(data, dict):
                for key, value in data.items():
                    if key in ("time_s", "error") or key.startswith("note"):
                        continue
                    if isinstance(value, (int, float)):
                        log(f"{task}: {key} = {value:.4f}")
                        break
                else:
                    if "error" in data:
                        log(f"{task}: ERROR - {data['error']}")

        if compact_results.get("composite_mean"):
            log(f"Composite Mean: {compact_results['composite_mean']:.4f}")
        if compact_results.get("math_mean"):
            log(f"Math Mean: {compact_results['math_mean']:.4f}")
        log(f"CO2 Emissions: {co2_val:.6f} kg")

        # Machine-readable output
        metric_payload = {
            "model_name": MODEL_NAME,
            "compact": safe_json(compact_results),
            "full": safe_json(full_results),
            "schema": schema_results,
            "co2_kg": compact_results.get("co2_emissions_kg", 0.0),
            "save_errors": save_errors if save_errors else None
        }

        metric_line = "METRIC_JSON:" + json.dumps(metric_payload, separators=(",", ":"))
        print(metric_line, flush=True)
        print(metric_line, file=sys.stderr, flush=True)

        # Final status
        if save_errors:
            log(f"⚠ Completed with {len(save_errors)} error(s)")
        else:
            log("✓ BenchmarksEvals v1 completed successfully")
        EOF
        
        # Execute the Python script with positional arguments
        python3 -u /tmp/evaluate.py \
          --model_name "$1" \
          --hf_token "$2" \
          --tasks "$3" \
          --limit "$4" \
          --batch_size "$5" \
          --num_fewshot "$6" \
          --out_compact "$7" \
          --out_full "$8" \
          --out_emissions "$9" \
          --out_schema "${10}"
      - "{{inputs.parameters.model_name}}"
      - "{{inputs.parameters.hf_token}}"
      - "{{inputs.parameters.tasks}}"
      - "{{inputs.parameters.limit}}"
      - "{{inputs.parameters.batch_size}}"
      - "{{inputs.parameters.num_fewshot}}"
      - "{{outputs.artifacts.compact_metrics.path}}"
      - "{{outputs.artifacts.full_results.path}}"
      - "{{outputs.artifacts.emissions_csv.path}}"
      - "{{outputs.artifacts.schema_json.path}}"
