name: HFConvertor v3
inputs:
  - name: tokenizer_json
    type: Model
    description: Path to tokenizer JSON file (optional)
  - name: model_pt
    type: Model
    description: Path to model PyTorch checkpoint file (required)
  - name: model_config_json
    type: Data
    description: Path to model config JSON file (optional)
outputs:
  - name: converted_model
    type: Model
    description: Path to converted HuggingFace model (artifact directory)
implementation:
  container:
    image: kumar2004/latest:v4
    command:
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import sys
        import json
        import shutil
        import re
        from collections import OrderedDict
        import torch

        def safe_mkdir(path):
            if path and not os.path.exists(path):
                os.makedirs(path, exist_ok=True)

        parser = argparse.ArgumentParser(description="HF converter (gptneox only)")
        parser.add_argument("--tokenizer_json", default="", help="tokenizer.json (optional)")
        parser.add_argument("--model_pt", required=True, help="Source checkpoint .pt/.bin")
        parser.add_argument("--model_config_json", default="", help="base config JSON (optional)")
        parser.add_argument("--out_converted", default="/tmp/outputs/converted_model/data", help="Artifact output dir")
        args = parser.parse_args()

        TOKENIZER_JSON = args.tokenizer_json
        SRC_PT = args.model_pt
        BASE_CFG_JSON = args.model_config_json
        OUT_CONVERTED = args.out_converted

        # Internal HF dir used as intermediate
        MODEL_DIR = "/tmp/hf_model"

        print("[CONVERT] Inputs:")
        print("  tokenizer_json:", TOKENIZER_JSON)
        print("  model_pt      :", SRC_PT)
        print("  config_json   :", BASE_CFG_JSON)
        print("  out_converted :", OUT_CONVERTED)
        print("  intermediate_model_dir:", MODEL_DIR)

        if not os.path.exists(SRC_PT):
            print(f"[FATAL] model_pt not found: {SRC_PT}", file=sys.stderr)
            sys.exit(2)

        safe_mkdir(os.path.dirname(OUT_CONVERTED))
        safe_mkdir(OUT_CONVERTED)
        safe_mkdir(MODEL_DIR)

        print("[CONVERT] Loading checkpoint:", SRC_PT)
        sd = torch.load(SRC_PT, map_location="cpu")
        if isinstance(sd, dict) and "state_dict" in sd:
            sd = sd["state_dict"]

        # Helper: write tokenizer files if provided
        def write_tokenizer_files(dst_dir, tokenizer_json_path, base_cfg):
            ids = {"pad_token_id": None, "unk_token_id": None, "bos_token_id": None, "eos_token_id": None}
            if tokenizer_json_path and os.path.exists(tokenizer_json_path):
                shutil.copy2(tokenizer_json_path, os.path.join(dst_dir, "tokenizer.json"))
                try:
                    with open(tokenizer_json_path, "r", encoding="utf-8") as f:
                        t = json.load(f)
                    name_map = {"[PAD]":"pad_token_id","[UNK]":"unk_token_id","[BOS]":"bos_token_id","[EOS]":"eos_token_id"}
                    for a in t.get("added_tokens", []):
                        if a.get("special") and "id" in a and a.get("content") in name_map:
                            ids[name_map[a["content"]]] = a["id"]
                except Exception:
                    pass
                print("[CONVERT] Copied tokenizer.json")
            else:
                print("[CONVERT] Warning: tokenizer.json not found; skipping copy.")
            # fill tok config from base cfg or defaults
            max_pos = int(base_cfg.get("max_position_embeddings") or base_cfg.get("max_seq_len") or 2048)
            tok_cfg = {
                "model_max_length": max_pos,
                "pad_token_id": int(ids.get("pad_token_id") or 0),
                "unk_token_id": int(ids.get("unk_token_id") or 1),
                "bos_token_id": int(ids.get("bos_token_id") or 2),
                "eos_token_id": int(ids.get("eos_token_id") or 3),
            }
            with open(os.path.join(dst_dir, "tokenizer_config.json"), "w", encoding="utf-8") as f:
                json.dump(tok_cfg, f, indent=2)
            spec_map = {"pad_token":"[PAD]","unk_token":"[UNK]","bos_token":"[BOS]","eos_token":"[EOS]"}
            with open(os.path.join(dst_dir, "special_tokens_map.json"), "w", encoding="utf-8") as f:
                json.dump(spec_map, f, indent=2)
            return tok_cfg

        # load base cfg json if provided
        base_cfg = {}
        if BASE_CFG_JSON and os.path.exists(BASE_CFG_JSON):
            try:
                with open(BASE_CFG_JSON, "r", encoding="utf-8") as f:
                    base_cfg = json.load(f)
                print("[CONVERT] Loaded base config from", BASE_CFG_JSON)
            except Exception:
                base_cfg = {}

        # GPT-NeoX conversion
        print("[CONVERT] Running GPT-NeoX conversion")
        
        # DEBUG: Print original checkpoint keys
        print("[DEBUG] Original checkpoint keys (first 20):")
        for i, k in enumerate(list(sd.keys())[:20]):
            print(f"  {i}: {k}")
        print(f"[DEBUG] Total keys in checkpoint: {len(sd.keys())}")

        def normalize_keys_neox(orig_sd):
            new_sd = OrderedDict()
            qkv_buffers = {}  # keyed by layer -> dict('q','k','v') for combining later
        
            for k, v in orig_sd.items():
                newk = k
                # ensure a top-level prefix for easier downstream handling
                if not newk.startswith("gpt_neox."):
                    newk = "gpt_neox." + newk
        
                # unify naming: blocks -> layers
                newk = newk.replace(".blocks.", ".layers.")
                # also handle either 'blocks.' after gpt_neox. or 'gpt_neox.blocks.' (above covers)
                newk = newk.replace(".blocks.", ".layers.")
                newk = newk.replace(".blocks", ".layers")
        
                # common upstream token embedding names -> embed_in / embed_out
                # support variants: token_emb.weight, token_embedding.weight, embed.weight
                newk = re.sub(r"\.token_emb(\.|_)","\.embed_in\\1", newk)
                newk = newk.replace(".token_emb", ".embed_in")
                newk = newk.replace(".token_embedding", ".embed_in")
                newk = newk.replace(".embed.weight", ".embed_in.weight")  # if someone used embed.weight
        
                # map old attention out proj naming to HF naming (keep existing mapping you had)
                newk = newk.replace(".out_proj.", ".attention.dense.")
                # map qkv_proj variants (if present) to hf combined key
                newk = newk.replace(".qkv_proj.", ".attention.query_key_value.")
        
                # Now handle separate W_query / W_key / W_value naming coming from some checkpoints
                # We'll detect layers like: gpt_neox.layers.<N>.attn.W_query.weight
                m = re.match(r"(gpt_neox\.layers\.(\d+)\.attn\.)W_(query|key|value)\.weight", newk)
                if m:
                    layer_prefix = m.group(1)  # e.g. gpt_neox.layers.0.attn.
                    layer_idx = m.group(2)
                    which = m.group(3)  # query/key/value
                    # store under a temporary name; don't add to new_sd yet
                    qkv_buffers.setdefault(layer_idx, {})[which] = v
                    # record a placeholder key so further reporting knows we processed it
                    # (do not add separate q/k/v into new_sd)
                    continue
        
                # If everything else is fine, add to new_sd
                new_sd[newk] = v
        
            # Try to combine q/k/v into a single HF-style query_key_value if possible
            for layer_idx, parts in qkv_buffers.items():
                prefix = f"gpt_neox.layers.{layer_idx}.attn."
                q = parts.get("query")
                k = parts.get("key")
                v = parts.get("value")
                if q is not None and k is not None and v is not None:
                    try:
                        # weights shapes must match; choose concat dim so result is (3*hidden, hidden) or (hidden, 3*hidden)
                        qw = q
                        kw = k
                        vw = v
                        if qw.shape == kw.shape == vw.shape:
                            # concat along 0 seems a reasonable default for many layouts (results in 3*hidden, hidden)
                            combined = torch.cat([qw, kw, vw], dim=0)
                            new_sd[prefix + "attention.query_key_value.weight"] = combined
                            print(f"[CONVERT] Combined Q/K/V -> {prefix}attention.query_key_value.weight")
                        else:
                            # shapes mismatch; emit separate keys with safer names (best-effort)
                            new_sd[prefix + "attention.query.weight"] = qw
                            new_sd[prefix + "attention.key.weight"] = kw
                            new_sd[prefix + "attention.value.weight"] = vw
                            print(f"[CONVERT] Left Q/K/V separate (shapes differ) for layer {layer_idx}")
                    except Exception as e:
                        print(f"[CONVERT] Failed to combine QKV for layer {layer_idx}: {e}")
                        # as fallback add separate named weights
                        if q is not None:
                            new_sd[prefix + "attention.query.weight"] = q
                        if k is not None:
                            new_sd[prefix + "attention.key.weight"] = k
                        if v is not None:
                            new_sd[prefix + "attention.value.weight"] = v
                else:
                    # missing one or more parts: add whatever we have back as best-effort
                    if q is not None:
                        new_sd[prefix + "attention.query.weight"] = q
                    if k is not None:
                        new_sd[prefix + "attention.key.weight"] = k
                    if v is not None:
                        new_sd[prefix + "attention.value.weight"] = v
                    print(f"[CONVERT] Incomplete QKV for layer {layer_idx}: parts={list(parts.keys())}")
        
            # Final safety normalizations for embed names: ensure embed_in exists
            # If token_emb variant remained or token vocabulary name existed, map it now
            if "gpt_neox.token_emb.weight" in new_sd and "gpt_neox.embed_in.weight" not in new_sd:
                new_sd["gpt_neox.embed_in.weight"] = new_sd.pop("gpt_neox.token_emb.weight")
                print("[CONVERT] Renamed gpt_neox.token_emb.weight -> gpt_neox.embed_in.weight")
            # Also support bare 'gpt_neox.embed.weight' -> embed_in
            if "gpt_neox.embed.weight" in new_sd and "gpt_neox.embed_in.weight" not in new_sd:
                new_sd["gpt_neox.embed_in.weight"] = new_sd.pop("gpt_neox.embed.weight")
                print("[CONVERT] Renamed gpt_neox.embed.weight -> gpt_neox.embed_in.weight")
        
            return new_sd

        out = normalize_keys_neox(sd)
        
        # DEBUG: Print normalized keys
        print("[DEBUG] Normalized checkpoint keys (first 30):")
        for i, k in enumerate(list(out.keys())[:30]):
            print(f"  {i}: {k}")
        print(f"[DEBUG] Total keys after normalization: {len(out.keys())}")

        # embed_out tie fallback
        if "gpt_neox.embed_out.weight" not in out and "gpt_neox.embed_in.weight" in out:
            out["gpt_neox.embed_out.weight"] = out["gpt_neox.embed_in.weight"]


        if "gpt_neox.embed_in.weight" not in out:
            alt_candidates = [k for k in out.keys() if "embed" in k and "weight" in k]
            if alt_candidates:
                print(f"[WARN] embed_in not found; using {alt_candidates[0]} as embed_in")
                out["gpt_neox.embed_in.weight"] = out[alt_candidates[0]]
            else:
                print("[FATAL] checkpoint missing gpt_neox.embed_in.weight", file=sys.stderr)
                sys.exit(3)

        torch.save(out, os.path.join(MODEL_DIR, "pytorch_model.bin"))
        print("[CONVERT] Wrote pytorch_model.bin (gptneox)")

        # infer dims
        vocab_size, hidden_size = out["gpt_neox.embed_in.weight"].shape
        layer_nums = [int(re.search(r"gpt_neox\.layers\.(\d+)\.", k).group(1))
                      for k in out if k.startswith("gpt_neox.layers.")]
        num_layers = 1 + max(layer_nums) if layer_nums else 1

        if "gpt_neox.layers.0.mlp.dense_h_to_4h.weight" in out:
            intermediate_size = out["gpt_neox.layers.0.mlp.dense_h_to_4h.weight"].shape[0]
        else:
            intermediate_size = hidden_size * 4

        def infer_heads(hid):
            for h in [32, 16, 8, 24, 12, 4, 2]:
                if hid % h == 0:
                    return h
            return max(1, hid // 64) or 8

        def detect_tie(sd_map):
            try:
                return sd_map["gpt_neox.embed_out.weight"].data_ptr() == sd_map["gpt_neox.embed_in.weight"].data_ptr()
            except Exception:
                return False

        num_heads = int(base_cfg.get("num_attention_heads") or base_cfg.get("num_heads") or infer_heads(hidden_size))
        max_pos = int(base_cfg.get("max_position_embeddings") or base_cfg.get("max_seq_len") or 512)
        rotary_pct = float(base_cfg.get("rotary_pct", 0.25))
        tie_word_embeddings = bool(base_cfg.get("tie_word_embeddings", detect_tie(out)))

        hf_cfg = {
            "architectures": ["GPTNeoXForCausalLM"],
            "model_type": "gpt_neox",
            "vocab_size": int(vocab_size),
            "hidden_size": int(hidden_size),
            "intermediate_size": int(intermediate_size),
            "num_attention_heads": int(num_heads),
            "num_hidden_layers": int(num_layers),
            "max_position_embeddings": int(max_pos),
            "rotary_pct": rotary_pct,
            "tie_word_embeddings": tie_word_embeddings,
        }

        with open(os.path.join(MODEL_DIR, "config.json"), "w", encoding="utf-8") as f:
            json.dump(hf_cfg, f, indent=2)
        print("[CONVERT] Wrote config.json (gptneox)")

        # if tied, drop embed_out
        if tie_word_embeddings and "gpt_neox.embed_out.weight" in out:
            out.pop("gpt_neox.embed_out.weight", None)
            torch.save(out, os.path.join(MODEL_DIR, "pytorch_model.bin"))
            print("[CONVERT] Re-saved pytorch_model.bin without embed_out (tied)")

        # tokenizer files + configs
        tok_cfg = write_tokenizer_files(MODEL_DIR, TOKENIZER_JSON, base_cfg)

        gen_cfg = {"max_length": tok_cfg.get("model_max_length", 512), "do_sample": False, "eos_token_id": tok_cfg["eos_token_id"]}
        with open(os.path.join(MODEL_DIR, "generation_config.json"), "w", encoding="utf-8") as f:
            json.dump(gen_cfg, f, indent=2)

        # Finally, copy the HF folder to the artifact dir
        print("[CONVERT] Copying HF folder to artifact dir:", OUT_CONVERTED)
        safe_mkdir(OUT_CONVERTED)
        for root, dirs, files in os.walk(MODEL_DIR):
            rel = os.path.relpath(root, MODEL_DIR)
            target_dir = os.path.join(OUT_CONVERTED, rel) if rel != "." else OUT_CONVERTED
            safe_mkdir(target_dir)
            for fname in files:
                shutil.copy2(os.path.join(root, fname), os.path.join(target_dir, fname))

        print("[CONVERT] Conversion completed successfully.")
        print("[CONVERT] Artifact available at:", OUT_CONVERTED)
    args:
      - --tokenizer_json
      - {inputPath: tokenizer_json}
      - --model_pt
      - {inputPath: model_pt}
      - --model_config_json
      - {inputPath: model_config_json}
      - --out_converted
      - {outputPath: converted_model}
