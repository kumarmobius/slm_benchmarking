name: Build Gemma3LM v3.1
inputs:
  - { name: tokenizer_json, type: Model, description: "Tokenizer JSON file" }
  - { name: model_pt, type: Model, description: "Torch model .pt weights file" }
  - { name: model_config, type: Data, description: "Model config file (json)" }

outputs:
  - { name: gemma_lm, type: Data, description: "Serialized Gemma3LM object" }

implementation:
  container:
    image: kushagra4761/nesy-factory-gpu:t2.6v4
    command:
      - python3
      - -u
      - -c
      - |
        import argparse
        import os
        import json
        import torch
        import cloudpickle
        import pickle
        import psutil
        from tokenizers import Tokenizer
        import torch.nn.functional as F
        from lm_eval.api.model import LM
        # from nesy_factory.language_model.gemma_wrapper import Gemma3LM
        from nesy_factory.language_model.gemma_implementation import Gemma3Model
        #gemma wrapper
        import torch
        import torch.nn.functional as F
        from lm_eval.api.model import LM
        from lm_eval.api.instance import Instance
        from typing import List, Sequence
        from tqdm import tqdm
        
        
        class Gemma3LM(LM):
            def __init__(self, model, tokenizer, device: str = "cuda"):
                super().__init__()
        
                self.model = model.to(device)
                self.model.eval()
                self.tokenizer = tokenizer
                self.device = device
        
                self._world_size = 1
                self._rank = 0
                self._local_rank = 0
        
            # -------- required distributed properties --------
            @property
            def rank(self):
                return self._rank
        
            @property
            def world_size(self):
                return self._world_size
        
            @property
            def local_rank(self):
                return self._local_rank
        
            # -------- required LM properties --------
            @property
            def max_length(self) -> int:
                return int(self.model.cfg.get("context_length", 2048))
        
            @property
            def vocab_size(self) -> int:
                if hasattr(self.tokenizer, "get_vocab_size"):
                    return int(self.tokenizer.get_vocab_size())
                return int(getattr(self.tokenizer, "vocab_size", 0))
        
            @property
            def eos_token_id(self):
                return getattr(self.tokenizer, "eos_token_id", None)
        
            @property
            def batch_size(self):
                return 1
        
            # -------- tokenization --------
            def tok_encode(self, text: str) -> List[int]:
                enc = self.tokenizer.encode(text)
                return list(enc.ids) if hasattr(enc, "ids") else list(enc)
        
            def tok_decode(self, tokens: Sequence[int]) -> str:
                try:
                    return self.tokenizer.decode(list(tokens), skip_special_tokens=False)
                except Exception:
                    return self.tokenizer.decode(list(tokens))
        
            # -------- model forward --------
            def _model_call(self, input_ids: Sequence[int]):
                # FIX: Explicitly specify dtype=torch.long for token IDs
                # This ensures compatibility with both FP32 and FP16 models
                ids = torch.tensor(input_ids, dtype=torch.long, device=self.device).unsqueeze(0)
        
                with torch.no_grad():
                    out = self.model(ids)
        
                if isinstance(out, (tuple, list)):
                    logits = out[0]
                else:
                    logits = out
        
                return logits
        
            # -------- generation --------
            def generate_until(self, requests: List[Instance], **kwargs) -> List[str]:
                outputs = []
        
                for request in tqdm(requests, desc="Generation", ncols=100):
                    context = request.args[0]
                    gen_kwargs = request.args[1] if len(request.args) > 1 else {}
        
                    until = gen_kwargs.get("until", []) if isinstance(gen_kwargs, dict) else []
                    max_gen_toks = gen_kwargs.get("max_gen_toks", 256) if isinstance(gen_kwargs, dict) else 256
        
                    if isinstance(until, str):
                        until = [until]
        
                    input_ids = self.tok_encode(context)
                    generated_ids = list(input_ids)
        
                    for _ in range(min(max_gen_toks, 256)):
                        if len(generated_ids) >= self.max_length:
                            break
        
                        logits = self._model_call(generated_ids)
                        next_id = int(torch.argmax(logits[0, -1]).item())
                        generated_ids.append(next_id)
        
                        gen_text = self.tok_decode(generated_ids[len(input_ids):])
        
                        for stop_str in until:
                            if stop_str in gen_text:
                                outputs.append(gen_text.split(stop_str)[0])
                                break
                        else:
                            continue
                        break
                    else:
                        outputs.append(self.tok_decode(generated_ids[len(input_ids):]))
        
                return outputs
        
            # -------- rolling loglikelihood --------
            def loglikelihood_rolling(self, requests: List[Instance], **kwargs) -> List[tuple]:
                results = []
        
                for request in tqdm(requests, desc="Rolling LL", ncols=100):
                    text = request.args[0]
                    token_ids = self.tok_encode(text)
        
                    if len(token_ids) <= 1:
                        results.append((0.0,))
                        continue
        
                    total_ll = 0.0
                    max_len = self.max_length
        
                    for start in range(0, len(token_ids) - 1, max_len - 1):
                        chunk = token_ids[start:start + max_len]
                        if len(chunk) <= 1:
                            continue
        
                        logits = self._model_call(chunk)
                        log_probs = F.log_softmax(logits[0], dim=-1)
        
                        for i in range(1, len(chunk)):
                            total_ll += log_probs[i - 1, chunk[i]].item()
        
                    results.append((total_ll,))
        
                return results
        
            # -------- conditional loglikelihood --------
            def loglikelihood(self, requests: List[Instance], **kwargs) -> List[tuple]:
                results = []
        
                for request in tqdm(requests, desc="Loglikelihood", ncols=100):
                    context, continuation = request.args
        
                    ctx_ids = self.tok_encode(context) if context else []
                    cont_ids = self.tok_encode(continuation)
        
                    if not cont_ids:
                        results.append((0.0, False))
                        continue
        
                    input_ids = ctx_ids + cont_ids
        
                    if len(input_ids) > self.max_length:
                        excess = len(input_ids) - self.max_length
                        input_ids = input_ids[excess:]
                        ctx_len = max(0, len(ctx_ids) - excess)
                    else:
                        ctx_len = len(ctx_ids)
        
                    logits = self._model_call(input_ids)
        
                    start = max(ctx_len - 1, 0)
                    end = min(start + len(cont_ids), logits.shape[1])
        
                    log_probs = F.log_softmax(logits[0, start:end], dim=-1)
                    targets = input_ids[ctx_len:ctx_len + log_probs.shape[0]]
        
                    ll = 0.0
                    greedy = True
        
                    for i, tok in enumerate(targets):
                        ll += log_probs[i, tok].item()
                        if torch.argmax(log_probs[i]).item() != tok:
                            greedy = False
        
                    results.append((ll, greedy))
        
                return results
        
            # -------- device helpers --------
            def to(self, device):
                self.device = device
                self.model = self.model.to(device)
                return self
        
            def half(self):
                # Convert model to half precision
                # Embeddings and token IDs will remain in their appropriate dtypes
                self.model = self.model.half()
                return self
        
            def eval(self):
                self.model.eval()
                return self
        parser = argparse.ArgumentParser()
        parser.add_argument("--tokenizer_json", required=True)
        parser.add_argument("--model_pt", required=True)
        parser.add_argument("--model_config", required=True)
        parser.add_argument("--gemma_lm", required=True)
        args = parser.parse_args()
        
        device = "cuda" if torch.cuda.is_available() else "cpu"
        print(f"[INFO] Device selected: {device}")
                
        if torch.cuda.is_available():
            gpu_count = torch.cuda.device_count()
            print(f"[INFO] GPUs available: {gpu_count}")
            for i in range(gpu_count):
                gpu_name = torch.cuda.get_device_name(i)
                gpu_memory = torch.cuda.get_device_properties(i).total_memory / (1024**3)
                print(f"[INFO] GPU {i}: {gpu_name} | Memory: {gpu_memory:.2f} GB")
        else:
            print("[INFO] No GPU available, using CPU")
        
        ram = psutil.virtual_memory()
        ram_total = ram.total / (1024**3)
        ram_available = ram.available / (1024**3)
        print(f"[INFO] System RAM: {ram_total:.2f} GB total | {ram_available:.2f} GB available")
        
        
        print("[INFO] Loading model config...")
        with open(args.model_config, "r") as f:
            cfg = json.load(f)
        
        print(f"[INFO] Original config loaded: {cfg.get('n_layers', 'N/A')} layers")
        
        # Convert dtype string to torch dtype
        dtype_map = {
            "float32": torch.float32,
            "float16": torch.float16,
            "bfloat16": torch.bfloat16,
            "float64": torch.float64,
            "torch.float32": torch.float32,
            "torch.float16": torch.float16,
            "torch.bfloat16": torch.bfloat16,
            "torch.float64": torch.float64
        }
        
        if "dtype" in cfg:
            dtype_str = cfg["dtype"]
            if isinstance(dtype_str, str):
                cfg["dtype"] = dtype_map.get(dtype_str, torch.float32)
                print(f"[INFO] Converted dtype '{dtype_str}' to {cfg['dtype']}")
            else:
                print(f"[INFO] dtype already in correct format: {cfg['dtype']}")
        else:
            cfg["dtype"] = torch.float32
            print(f"[INFO] No dtype specified, defaulting to torch.float32")
        
        # Normalize layer_types to all full_attention
        if "n_layers" in cfg:
            original_layer_types = cfg.get("layer_types", [])
            cfg["layer_types"] = ["full_attention"] * cfg["n_layers"]
            print(f"[INFO] Normalized layer_types from {original_layer_types} to all 'full_attention' for {cfg['n_layers']} layers")
        else:
            print("[WARNING] 'n_layers' not found in config")
        
        # Normalize qk_norm to proper boolean
        if "qk_norm" in cfg:
            qk_norm_value = cfg["qk_norm"]
            # Handle various boolean representations
            if isinstance(qk_norm_value, bool):
                cfg["qk_norm"] = qk_norm_value
            elif isinstance(qk_norm_value, str):
                cfg["qk_norm"] = qk_norm_value.lower() in ("true", "1", "yes", "y")
            elif isinstance(qk_norm_value, (int, float)):
                cfg["qk_norm"] = bool(qk_norm_value)
            else:
                cfg["qk_norm"] = False
            print(f"[INFO] Normalized qk_norm from '{qk_norm_value}' to {cfg['qk_norm']}")
        
        print("[INFO] Loading tokenizer...")
        tokenizer = Tokenizer.from_file(args.tokenizer_json)
        print("[INFO] Tokenizer loaded successfully")
        
        print(f"[INFO] Loading model to {device}...")
        model = Gemma3Model(cfg).to(device)
        print("[INFO] Gemma3Model architecture loaded")
        
        print("[INFO] Loading model weights...")
        state_dict = torch.load(args.model_pt, map_location=device)
        model.load_state_dict(state_dict, strict=True)
        model.eval()
        print("[INFO] Model weights loaded and set to eval mode")
        
        print("[INFO] Creating Gemma3LM wrapper...")
        gemma_lm = Gemma3LM(model, tokenizer, device=device)
        
        print("[INFO] Serializing with pickle...")
        os.makedirs(os.path.dirname(args.gemma_lm), exist_ok=True)
        with open(args.gemma_lm, "wb") as f:
            pickle.dump(gemma_lm, f)
        
        print("[OK] Gemma3LM object created and saved successfully")
        print(f"[OK] Final config - dtype: {cfg['dtype']}, layer_types: {cfg['layer_types']}")
    args:
      - --tokenizer_json
      - { inputPath: tokenizer_json }
      - --model_pt
      - { inputPath: model_pt }
      - --model_config
      - { inputPath: model_config }
      - --gemma_lm
      - { outputPath: gemma_lm }
