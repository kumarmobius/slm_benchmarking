name: GemmaLMEval V10.1
inputs:
  - name: gemma_model
    type: Data
    description: Cloud-pickled Gemma3LM object
  - name: tasks
    type: String
    default: "gpqa,mmlu_pro,bbh,math,ifeval"
    description: "Comma-separated lm_eval task names. Use 'math' for hendrycks_math"
  - name: num_fewshot
    type: Integer
    default: "0"
    description: Number of few-shot examples
  - name: limit
    type: Integer
    default: "100"
    description: "Evaluation limit per task. Use -1 for all examples"
  - name: batch_size
    type: Integer
    default: "6"
    description: "Batch size for evaluation. Use -1 for auto batch size"
  - name: hf_token
    type: String
    default: ""
    description: Hugging Face authentication token
  - name: model_name
    type: String
    default: "Gemma3"
    description: "Model name for schema (default: Gemma3)"
outputs:
  - name: compact_metrics
    type: Data
    description: Compact JSON with task scores and CO2
  - name: full_results
    type: Data
    description: Full evaluation results with all metrics
  - name: schema_json
    type: String
    description: Clean schema with percentage scores
  - name: emissions_csv
    type: Data
    description: CodeCarbon emissions CSV
implementation:
    image: kushagra4761/nesy-factory-gpu:t2.6v2
    command:
      - sh
      - -c
      - |
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location \
          'lm-eval==0.4.4' \
          'transformers>=4.35.0' \
          'torch>=2.0.0' \
          'accelerate>=0.25.0' \
          'datasets>=2.14.0,<4.0.0' \
          'evaluate>=0.4.0' \
          'scikit-learn>=1.3.0' \
          'pandas>=2.0.0' \
          'numpy<2.0.0' \
          'tqdm>=4.65.0' \
          'sentencepiece>=0.1.99' \
          'protobuf>=3.20.0' \
          'tokenizers>=0.13.0' \
          'codecarbon>=2.3.0' \
          'peft>=0.7.0' \
          'langdetect' \
